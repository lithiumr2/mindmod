name: mindmod
description: IDE de Mods para Mindustry en Flutter
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  shared_preferences: ^2.2.2
  flutter_colorpicker: ^1.1.0
  file_picker: ^8.1.2
  archive: ^3.6.1
  path_provider: ^2.1.3

dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.22
  


flutter_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21
  web:
    generate: false
    image_path: "assets/icon.png"
    background_color: "#18181C"
    theme_color: "#18181C"
