name: mindmod
description: IDE de Mods para Mindustry en Flutter
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  file_picker: ^8.1.2
  archive: ^3.6.1
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.22
  
