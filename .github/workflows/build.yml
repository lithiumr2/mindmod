name: Build Android APK

on:
  push:
    branches: [ "main", "experimental" ]
  pull_request:
    branches: [ "main", "experimental" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Regenerar estructura Android limpia (v2 embedding)
        run: |
          rm -rf android
          flutter create . --platforms=android --org=com.mindmod
      - name: Forzar compileSdk y minSdk en el proyecto y sus dependencias
        run: |
          python3 -c "
          import os
          import re
          for root, dirs, files in os.walk('android'):
              for file in files:
                  if file.startswith('build.gradle'):
                      filepath = os.path.join(root, file)
                      with open(filepath, 'r') as f:
                          content = f.read()
                      
                      content = re.sub(r'compileSdk(?:Version)?\s*=?\s*[0-9]+', 'compileSdkVersion 34', content)
                      content = re.sub(r'compileSdkVersion\s*=\s*flutter.compileSdkVersion', 'compileSdkVersion = 34', content)
                      content = re.sub(r'compileSdk\s*=\s*flutter.compileSdkVersion', 'compileSdk = 34', content)
                      content = re.sub(r'targetSdk(?:Version)?\s*=?\s*[0-9]+', 'targetSdkVersion 34', content)
                      content = re.sub(r'targetSdkVersion\s*=\s*flutter.targetSdkVersion', 'targetSdkVersion = 34', content)
                      
                      with open(filepath, 'w') as f:
                          f.write(content)
          
          root_gradle = 'android/build.gradle'
          if os.path.exists(root_gradle):
              with open(root_gradle, 'r') as f:
                  content = f.read()
              
              if 'ext.kotlin_version' in content:
                  content = re.sub(r'ext.kotlin_version\s*=\s*['"].*?['"]', 'ext.kotlin_version = \'1.9.10\'', content)
              
              with open(root_gradle, 'w') as f:
                  f.write(content)
                  
              with open(root_gradle, 'a') as f:
                  f.write('''
          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 34
                          defaultConfig {
                              minSdkVersion 21
                              targetSdkVersion 34
                          }
                      }
                  }
              }
          }
          ''')
          "

      - name: Instalar dependencias
        run: flutter pub get

      - name: Generar Icono de la App
        run: flutter pub run flutter_launcher_icons

      - name: Generar Splash Screen
        run: dart run flutter_native_splash:create

      - name: Configurar Firma de Release (Keystore)
        run: |
          if [ -f mindmod.jks ]; then
            echo "Usando keystore permanente del repositorio"
            cp mindmod.jks android/app/mindmod.jks
          else
            echo "Generando keystore temporal de respaldo..."
            keytool -genkey -v -keystore mindmod.jks -keyalg RSA -keysize 2048 -validity 10000 -alias mindmod -storepass mindmod -keypass mindmod -dname "CN=Mindmod, OU=Mindmod, O=Mindmod, L=Mindmod, ST=Mindmod, C=US"
            cp mindmod.jks android/app/mindmod.jks
          fi
          
          python3 -c "
          import os
          import re
          gradle_path = 'android/app/build.gradle'
          kts_path = 'android/app/build.gradle.kts'
          target = kts_path if os.path.exists(kts_path) else gradle_path
          with open(target, 'r') as f: content = f.read()
          
          if target == kts_path:
              sign_block = '''
              signingConfigs {
                  create(\"release\") {
                      storeFile = file(\"mindmod.jks\")
                      storePassword = \"mindmod\"
                      keyAlias = \"mindmod\"
                      keyPassword = \"mindmod\"
                  }
              }
              '''
              content = content.replace('buildTypes {', sign_block + '    buildTypes {')
              content = content.replace('signingConfig = signingConfigs.getByName(\"debug\")', 'signingConfig = signingConfigs.getByName(\"release\")')
          else:
              sign_block = '''
              signingConfigs {
                  release {
                      storeFile file(\"mindmod.jks\")
                      storePassword \"mindmod\"
                      keyAlias \"mindmod\"
                      keyPassword \"mindmod\"
                  }
              }
              '''
              content = content.replace('buildTypes {', sign_block + '    buildTypes {')
              content = content.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release')
          
          with open(target, 'w') as f: f.write(content)
          "

      - name: Compilar APK release
        run: flutter build apk --release --no-tree-shake-icons --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: mindmod-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
