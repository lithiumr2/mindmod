name: Build Android APK

on:
  push:
    branches: [ "main", "experimental" ]
  pull_request:
    branches: [ "main", "experimental" ]
    
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Regenerar estructura Android limpia (v2 embedding)
        run: |
          rm -rf android
          flutter create . --platforms=android --org=com.mindmod

      - name: Forzar compileSdk y minSdk en el proyecto y sus dependencias
        run: |
          python3 -c "
          import os

          for root, dirs, files in os.walk('android'):
              for file in files:
                  if file.startswith('build.gradle'):
                      filepath = os.path.join(root, file)
                      with open(filepath, 'r') as f:
                          content = f.read()
                      
                      if 'compileSdk' in content:
                          import re
                          content = re.sub(r'compileSdk\s*=*\s*\d+', 'compileSdk = 36', content)
                          content = re.sub(r'compileSdkVersion\s*=*\s*\d+', 'compileSdkVersion = 36', content)
                      
                      with open(filepath, 'w') as f:
                          f.write(content)

          root_gradle = 'android/build.gradle'
          if os.path.exists(root_gradle):
              with open(root_gradle, 'a') as f:
                  f.write('''

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 36
                      }
                  }
              }
          }
          ''')
          "

      - name: Instalar dependencias
        run: flutter pub get

      - name: Configurar Firma de Release (Keystore)
        run: |
          keytool -genkey -v -keystore android/app/mindmod.jks -keyalg RSA -keysize 2048 -validity 10000 -alias mindmod -storepass mindmod -keypass mindmod -dname "CN=Mindmod, OU=Mindmod, O=Mindmod, L=Mindmod, ST=Mindmod, C=US"
          
          awk '
          /buildTypes \{/ {
            print "    signingConfigs {"
            print "        release {"
            print "            storeFile file(\"mindmod.jks\")"
            print "            storePassword \"mindmod\""
            print "            keyAlias \"mindmod\""
            print "            keyPassword \"mindmod\""
            print "        }"
            print "    }"
          }
          {
            gsub(/signingConfig signingConfigs.debug/, "signingConfig signingConfigs.release")
            print $0
          }' android/app/build.gradle > android/app/build.gradle.tmp
          mv android/app/build.gradle.tmp android/app/build.gradle

      - name: Compilar APK release
        run: flutter build apk --release --no-tree-shake-icons

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: mindmod-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          
