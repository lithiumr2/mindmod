name: Auto-Heal Bot

on:
  workflow_dispatch:
    inputs:
      failed_run_id:
        description: 'ID de la ejecucion que fallo'
        required: true
        type: string

jobs:
  auto-heal:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: experimental
          fetch-depth: 5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Failed Logs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Descargando logs para Run ID: ${{ inputs.failed_run_id }}"
          gh run view ${{ inputs.failed_run_id }} --log-failed > error.log || echo "No logs found" > error.log

      - name: Run Auto-Healer AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node .github/scripts/heal.js

      - name: Commit and Push Fix
        run: |
          if [ -f commit_msg.txt ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -F commit_msg.txt
            git push origin experimental
          else
            echo "No fix required or max attempts reached."
          fi
