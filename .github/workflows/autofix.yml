name: Auto-Heal Bot

on:
  workflow_run:
    workflows: ["Build Android APK", "Build Windows App"]
    types:
      - completed

jobs:
  auto-heal:
    # Solo ejecuta si la compilación falló y estamos en la rama experimental
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'experimental'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: experimental
          fetch-depth: 5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Failed Logs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Descarga los logs del workflow que acaba de fallar
          gh run view ${{ github.event.workflow_run.id }} --log-failed > error.log || echo "No logs found" > error.log

      - name: Run Auto-Healer AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node .github/scripts/heal.js

      - name: Commit and Push Fix
        run: |
          if [ -f commit_msg.txt ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -F commit_msg.txt
            git push origin experimental
          else
            echo "No fix required or max attempts reached."
          fi
